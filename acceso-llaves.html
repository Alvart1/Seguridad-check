<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Llaves</title>
    <link rel="stylesheet" href="css/crear-cuenta.css">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>        
</head>
<body>
    <div id="contenedor-verificacion" style="display:none;">
    <video id="video-verificar" autoplay playsinline style="width: 100%; border-radius: 10px;"></video>
    <p id="mensaje-ia">Escaneando rostro...</p>
</div>
    <div class="panel">
        <div class="titulo">
            <h1 id="texto-titulo">Acceso a Llaves</h1>
        </div>

        <div id="interfaz-dinamica" class="contenedor-accion">
            <p>Cargando configuración de acceso...</p>
        </div>

        <div class="zona-inferior">
            <button type="button" class="crear-cuenta" onclick="crearcuenta()">
                Crear cuenta
            </button>
            
            <button type="button" class="btn-finalizar" onclick="confirmarFinEstancia()">
                Finalizar Estancia
            </button>
        </div>
    </div>

    <script src="js/acceso-llaves.js"></script>
</body>
</html>
