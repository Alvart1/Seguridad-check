<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-in QR</title>
    <link rel="stylesheet" href="css/estilo-inicio.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

</head>
<body>

    <div id="pantalla-inicio">
        <div class="titulo">
            <h1>Bienvenido querido cliente!!!</h1>
        </div>
        
        <p>Introduzca su PIN para generar el código QR de acceso</p>
        
        <input type="password" id="pinInput" placeholder="PIN" maxlength="4">
        <button onclick="verificarYGenerar()">Desbloquear</button>
    </div>

    <div id="pantalla-resultado" style="display: none; width: 100%; flex-direction: column; align-items: center;">
        <div class="titulo">
            <h1>Acceso Listo</h1>
        </div>

        <p>Escanee el código o use el enlace inferior</p>

        <div id="qrcode"></div>

        <a href="https://alvart1.github.io/Seguridad-check/formulario.html" class="enlace-secreto">
            Acceder mediante enlace directo
        </a><br>

        <button onclick="window.location.reload()" >Volver</button>
    </div>

    <script src="js/index-js.js"></script>
</body>
</html>
