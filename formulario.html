<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registro y Acceso Apartamento</title>
    <link rel="stylesheet" href="css/estilo-formulario.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
</head>
<body>
    <div id="debug-error" style="color: white; background: red; padding: 10px; display: none; position: fixed; top: 0; z-index: 9999;">
    Erro detectado no JS. Revisa a consola.
</div>
    <div id="paso-inicio" class="encabezado" style="display: none;">
        <h1>¿Cuántos huéspedes son?</h1>
        <div style="display: flex; gap: 10px; justify-content: center; margin-top: 15px;">
            
            <button onclick="comezarRexistro(1)">1</button>
            <button onclick="comezarRexistro(2)">2</button>
            <button onclick="comezarRexistro(3)">3</button>
            <button onclick="comezarRexistro(4)">4</button>
        </div>
    </div>

    <div id="seccion-formulario" class="viajero-bloque" style="display: none; width: 100%;">
        <h2 id="titulo-formulario" style="text-align: center; margin-top: 20px;">Datos del Viajero 1</h2>
        <form id="formulario">
            <div class="campo"><label>Nombre:</label><input type="text" id="nombre" required></div>
            <div class="campo"><label>Apellidos:</label><input type="text" id="apellidos" required></div>
            <div class="campo">
                <label>Género:</label>
                <select id="genero" required>
                    <option value="vacio">  </option>
                    <option value="masculino">Masculino</option>
                    <option value="femenino">Femenino</option>
                    <option value="otro">Otro</option>
                </select>
            </div>
            <div class="campo"><label>DNI / Pasaporte:</label><input type="text" id="documento" required></div>
            <div class="campo"><label>Dirección:</label><input type="text" id="direccion" required></div>
            <div class="campo"><label>Fecha nacimiento:</label><input type="date" id="fecha_nac" required></div>
            <div class="campo"><label>Email:</label><input type="email" id="correo" required></div>

            <div class="campo" style="flex-direction: column; align-items: center;">
                <label>Firma:</label>
                <canvas id="canvas-firma" width="350" height="200" style="border: 2px solid #fff; background-color: aliceblue; border-radius: 10px;"></canvas>
                <button type="button" onclick="limparFirma()" style="padding: 10px; width: 50%; font-size: 14px; margin-top: 10px; background-color: #7f8c8d; color: white;">Limpiar Firma</button>
            </div>
            <button type="submit" style="background-color: #2ecc71;">Enviar y Continuar</button>
        </form>
    </div>

    <script src="js/formulario.js"></script>
</body>
</html>
