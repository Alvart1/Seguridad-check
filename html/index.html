<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="../css/estilo-bloqueo1.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

</head>
<body>
<div class="container">
    
<div id="screen-lock">
    <h1>🔒 Sistema Bloqueado</h1>
    <p>Introduce el PIN de tu reserva</p>
    <input type="number" id="pin-input" placeholder="0000">
    
    <p id="mensaje-error" style="font-size: 0.9rem; height: 20px;"></p>
    
    <button class="btn btn-primary" onclick="checkPin()">Acceder</button>
</div>

    <div id="screen-form" style="display:none;">
        <h1>Escanea el QR</h1>
        <p>Por favor, rellena los datos legales de check-in desde tu móvil</p>
        <div id="qrcode"></div>
        <div class="loader">Esperando validación...</div>
    </div>

    <div id="screen-dashboard" style="display:none;">
        <h1>¡Hola! Bienvenido</h1>
        <p>¿Qué necesitas hacer ahora?</p>
        <div class="grid-menu">
            <button class="btn btn-success" onclick="openDrawer()">🔑 Recoger mis Llaves</button>
            <button class="btn btn-help" onclick="callHost()">📞 Necesito Ayuda</button>
            <button class="btn btn-danger" onclick="endStay()">🚪 Terminar Estancia</button>
        </div>
    </div>

</div>
<script src="../js/bloqueo1.js"></script>
</body>
</html>
