<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurar Acceso</title>
    <link rel="stylesheet" href="css/crear-cuenta.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>
<body>
    <div class="panel">
        <div id="paso-seleccion">
            <h1>Crea tu cuenta de acceso</h1>
            <p>¿Cómo prefieres abrir el cajón?</p>
            <div class="grid-opciones">
                <button onclick="mostrarFormulario('pin')" class="btn-metodo"> PIN Numérico</button>
                <button onclick="mostrarFormulario('foto')" class="btn-metodo"> Reconocimiento Facial</button>
            </div>
        </div>

        <div id="form-pin" style="display: none;">
            <h2>Configurar PIN</h2>
            <label>Nombre:</label> 
            <input type="text" id="nombre-pin" placeholder="Tu nombre">
            <label>Pin:</label>
            <input type="password" id="pin-valor" placeholder="PIN de 4 cifras" maxlength="4">
            <button onclick="guardarYVolver('pin')" class="btn-guardar">Guardar y Finalizar</button>
        </div>

        <div id="form-foto" style="display: none;">
            <h2>Reconocimiento Facial</h2>
            <div class="visor-camara">
                <div class="placeholder-cam"> Esperando cámara...</div>
            </div>
            <button onclick="guardarYVolver('foto')" class="btn-guardar">Capturar y Guardar</button>
        </div>
        
        <button onclick="window.location.href='acceso-llaves.html'" class="btn-cancelar">Volver atrás</button>
    </div>

    <script src="js/crear-cuenta.js"></script>
</body>
</html>
